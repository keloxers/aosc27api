# Desarrollo local: una instancia contra una base local o un túnel. Producción: deploy/docker-compose.yml.
services:
  aosc-api:
    build: .
    image: aosc-api:latest
    restart: unless-stopped
    env_file: .env
    environment: {FCM_CREDENTIALS: /secrets/firebase-credentials.json}
    volumes:
      # Directorio con la cuenta de servicio de Firebase (firebase-credentials.json).
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "/aosc-api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:8090:8080"
