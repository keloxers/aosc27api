# Despliegue junto a aosc_front en el mismo servidor. Ajustar la red para que
# el contenedor llegue a la base `aosc` (DB_HOST) y al proxy que publica
# aosc.gob.ar.
services:
  aosc-api:
    build: .
    image: aosc-api:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      # Cuenta de servicio de Firebase (la misma que usa aosc_front).
      - ./firebase-credentials.json:/secrets/firebase-credentials.json:ro
    healthcheck:
      test: ["CMD", "/aosc-api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:8090:8080"
    # Con Traefik, en lugar de `ports`, rutear /api/v1 de aosc.gob.ar a este
    # servicio (la app no necesita cambiar su base URL):
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.aosc-api.rule=Host(`aosc.gob.ar`) && PathPrefix(`/api/v1`)
    #   - traefik.http.routers.aosc-api.entrypoints=websecure
    #   - traefik.http.routers.aosc-api.tls.certresolver=letsencrypt
    #   - traefik.http.services.aosc-api.loadbalancer.server.port=8080
