# aosc-api en PRODUCCIÓN (VPS Vi-App-A, ~/apps/go/aosc27api/). Dos instancias, una imagen.
# Bases en Vi-MariaDb (`aosc`, `covesa`; regla: nunca bases en Vi-App-A). Puertos sólo en la IP privada;
# los alcanza únicamente Vi-Proxy (Traefik). Secretos en .env.<instancia> y secrets/ (600, fuera de git).
name: aosc27api

x-api: &api
  image: aosc-api:latest
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  healthcheck:
    test: ["CMD", "/aosc-api", "healthcheck"]
    interval: 30s
    timeout: 5s
    retries: 3
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  aosc:
    <<: *api
    build: {context: ..}
    container_name: aosc-api-aosc
    env_file: ./.env.aosc
    environment: {HTTP_ADDR: ":8080", INSTANCIA: aosc, FCM_CREDENTIALS: /secrets/firebase-credentials.json}
    volumes: [./secrets/aosc:/secrets:ro]
    ports: ["${BIND_IP:?definir BIND_IP}:6880:8080"]

  covesa:
    <<: *api
    container_name: aosc-api-covesa
    env_file: ./.env.covesa
    # Sin push: la base covesa no tiene dispositivos/notificaciones_* (ver internal/instancia).
    environment: {HTTP_ADDR: ":8080", INSTANCIA: covesa, NOTIFICACIONES_HABILITADAS: "false"}
    ports: ["${BIND_IP:?definir BIND_IP}:6881:8080"]
    depends_on: [aosc]   # la imagen la construye aosc
